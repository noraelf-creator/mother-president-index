<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お母さんは大統領｜閲覧版</title><link rel="stylesheet" href="css/style.css"><main><p><a href="index.html">← INDEX</a></p><h1>お母さんは大統領｜本文アーカイブ</h1><p>UZU編集UI・送付メタ文を表示から除外した閲覧版です。</p><iframe id="source" src="archive.html" title="本文アーカイブ"></iframe></main><style>iframe{width:100%;height:88vh;border:1px solid #e6d9dc;background:#fff}</style><script>
const remove=/^(次へボタン|制限時間|所要時間目安|押せる条件を設定|基本遷移先|条件付き遷移|条件付き遷移を追加|フェーズ内容の記録|配布なし|タイムライン|ゲームの流れ編集へ|追加|実行する|未公開時の設定|配布条件|閲覧権付与条件|自動公開条件|回収条件|これが各種HO.*|これが追加HO.*|まだ追加するから待ってね.*|一旦これが読み合わせ文章.*|次張るね.*|これうずに最初張ってたやつを張ってるから気を付けてね.*)$/;
document.querySelector('#source').addEventListener('load',e=>{const d=e.target.contentDocument;d.querySelectorAll('pre').forEach(p=>{let lines=p.textContent.split('\n');let skip=0;lines=lines.filter(line=>{const t=line.trim();if(t==='表示条件:'){skip=2;return false}if(skip){skip--;return false}return !remove.test(t)});let x=lines.join('\n');x=x.replace(/&amp;#(x[0-9a-fA-F]+|[0-9]+);/g,'&#$1;');const ta=d.createElement('textarea');ta.innerHTML=x;x=ta.value;const out=d.createElement('div');out.className='text';out.innerHTML=x.split('\n').map(l=>{let m=l.match(/^(#{1,3}) \*\*(.*?)\*\*$/);if(m)return '<h'+m[1].length+'>'+m[2]+'</h'+m[1].length+'>';return l.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^image$/,'[画像]')}).join('<br>');p.replaceWith(out)});d.querySelectorAll('body *').forEach(n=>{if(n.children.length===0&&remove.test(n.textContent.trim()))n.remove()});d.querySelectorAll('style').forEach(s=>s.remove());const st=d.createElement('style');st.textContent='body{font-family:Meiryo,sans-serif;line-height:1.85;color:#231f2b;margin:0;background:#fff}header,nav{display:none}main{padding:10px;max-width:900px}.text{white-space:normal;overflow-wrap:anywhere}.text h1,.text h2,.text h3{color:#6c1f36;border-bottom:1px solid #e6d9dc;margin-top:2em;padding-bottom:.3em}.text strong{font-weight:700}article{margin:1em 0}';d.head.append(st)})</script></html>
